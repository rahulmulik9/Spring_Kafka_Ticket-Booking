spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketdb
    username: ticketuser
    password: ticketpass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  jpa:
    show-sql: false
    properties:
      hibernate:
        generate_statistics: true
#        format_sql: true

logging:
  level:
    root: INFO
    com.rahul.ticketbooking: DEBUG
    org.hibernate.stat: DEBUG
#    org.hibernate.SQL: debug
#    org.hibernate.orm.jdbc.bind: trace   #dispaly parameters in query

server:
  port: 8080