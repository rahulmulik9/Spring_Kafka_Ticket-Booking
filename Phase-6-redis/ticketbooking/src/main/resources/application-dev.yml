spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketdb
    username: ticketuser
    password: ticketpass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
      connection-init-sql: SET lock_timeout = 3000
  jpa:
    show-sql: false
    properties:
      hibernate:
        generate_statistics: true
#        format_sql: true

logging:
  level:
    root: INFO
    com.rahul.ticketbooking: DEBUG
    org.hibernate.stat: DEBUG
#    org.hibernate.SQL: debug
#    org.hibernate.orm.jdbc.bind: trace   #dispaly parameters in query

server:
  port: 8080

jwt:
  secret: dev-only-secret-key-change-in-prod-min-32-chars
  expiration-minutes: 15
  refresh-expiration-days: 7

seat-hold:
  ttl-seconds: 30   # short on purpose so you can watch it expire. The default in code is 300 (5 minutes)

login-limit:
  max-attempts: 5
  window-seconds: 60   # short on purpose so you can watch it reset. The default in code is 300